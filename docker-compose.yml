# Production-shaped local deployment: Redis + API + worker + Next.js frontend.
# Only the frontend is published; it proxies same-origin /api requests internally.
x-backend-env: &backend-env
  DEJAVIEW_PROVIDER: ${DEJAVIEW_PROVIDER:-deepseek}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  DEJAVIEW_MODEL_CHEAP: ${DEJAVIEW_MODEL_CHEAP:-deepseek-v4-flash}
  DEJAVIEW_MODEL_STANDARD: ${DEJAVIEW_MODEL_STANDARD:-deepseek-v4-pro}
  DEJAVIEW_MODEL_STRONG: ${DEJAVIEW_MODEL_STRONG:-deepseek-v4-pro}
  DEJAVIEW_CRAWLER: ${DEJAVIEW_CRAWLER:-builtin}
  DEJAVIEW_REPOMAP: ${DEJAVIEW_REPOMAP:-builtin}
  DEJAVIEW_SEARCH_PROVIDER: ${DEJAVIEW_SEARCH_PROVIDER:-composite}
  DEJAVIEW_SEARCH_SOURCES: ${DEJAVIEW_SEARCH_SOURCES:-github,v2ex}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  DEJAVIEW_ACCESS_CODE: ${DEJAVIEW_ACCESS_CODE:-}
  DEJAVIEW_CORS_ORIGINS: ${DEJAVIEW_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  DEJAVIEW_TRUSTED_PROXIES: ${DEJAVIEW_TRUSTED_PROXIES:-}
  DEJAVIEW_QUEUE: rq
  DEJAVIEW_JOBSTORE: ${DEJAVIEW_JOBSTORE:-redis}
  DEJAVIEW_REDIS_URL: redis://redis:6379/0
  DEJAVIEW_SQL_URL: ${DEJAVIEW_SQL_URL:-sqlite:////data/jobs.db}
  DEJAVIEW_RATE_LIMIT_ENABLED: ${DEJAVIEW_RATE_LIMIT_ENABLED:-true}
  DEJAVIEW_RATE_LIMIT_PER_IP_HOURLY: ${DEJAVIEW_RATE_LIMIT_PER_IP_HOURLY:-10}
  DEJAVIEW_RATE_LIMIT_PER_IP_DAILY: ${DEJAVIEW_RATE_LIMIT_PER_IP_DAILY:-0}
  DEJAVIEW_RATE_LIMIT_DAILY_TOTAL: ${DEJAVIEW_RATE_LIMIT_DAILY_TOTAL:-200}
  PYTHONPATH: /app

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment: *backend-env
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment: *backend-env
    command: ["rq", "worker", "-u", "redis://redis:6379/0", "dejaview"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DEJAVIEW_BACKEND: http://backend:8000
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    profiles: [pg]
    restart: unless-stopped
    environment:
      POSTGRES_USER: dejaview
      POSTGRES_PASSWORD: dejaview
      POSTGRES_DB: dejaview
    volumes: [pg-data:/var/lib/postgresql/data]

volumes:
  redis-data:
  pg-data:
