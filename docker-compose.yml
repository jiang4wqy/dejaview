# DejaView 生产部署: redis + backend(API) + worker(rq) + frontend  (可选 postgres)
# 最简用法: ./deploy.sh           (自动生成 .env → 提示填 key → 构建启动 → 打印访问地址)
# 或手动:   cp deploy.env.example .env && 填 DEEPSEEK_API_KEY, 然后 docker compose up -d --build
# 单端口: 只需对外开放前端 :3000，浏览器走同源 /api 反代到后端(见 frontend 服务)。
# 用 Postgres 而非 redis 存储: docker compose --profile pg up -d, 并把 DEJAVIEW_JOBSTORE=sql
#   DEJAVIEW_SQL_URL=postgresql://dejaview:dejaview@postgres:5432/dejaview
x-backend-env: &backend-env
  DEJAVIEW_PROVIDER: ${DEJAVIEW_PROVIDER:-deepseek}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  DEJAVIEW_MODEL_CHEAP: ${DEJAVIEW_MODEL_CHEAP:-deepseek-v4-flash}
  DEJAVIEW_MODEL_STANDARD: ${DEJAVIEW_MODEL_STANDARD:-deepseek-v4-pro}
  DEJAVIEW_MODEL_STRONG: ${DEJAVIEW_MODEL_STRONG:-deepseek-v4-pro}
  DEJAVIEW_CRAWLER: ${DEJAVIEW_CRAWLER:-builtin}
  DEJAVIEW_REPOMAP: builtin
  DEJAVIEW_SEARCH_PROVIDER: ${DEJAVIEW_SEARCH_PROVIDER:-composite}
  DEJAVIEW_SEARCH_SOURCES: ${DEJAVIEW_SEARCH_SOURCES:-github,v2ex}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  DEJAVIEW_QUEUE: rq
  DEJAVIEW_JOBSTORE: ${DEJAVIEW_JOBSTORE:-redis}
  DEJAVIEW_REDIS_URL: redis://redis:6379/0
  DEJAVIEW_SQL_URL: ${DEJAVIEW_SQL_URL:-sqlite:////data/jobs.db}
  # 限流(模式A "你请客": 保护部署者额度; 公开部署默认开启, 走 redis 计数)
  DEJAVIEW_RATE_LIMIT_ENABLED: ${DEJAVIEW_RATE_LIMIT_ENABLED:-true}
  DEJAVIEW_RATE_LIMIT_PER_IP_HOURLY: ${DEJAVIEW_RATE_LIMIT_PER_IP_HOURLY:-10}
  DEJAVIEW_RATE_LIMIT_DAILY_TOTAL: ${DEJAVIEW_RATE_LIMIT_DAILY_TOTAL:-200}
  PYTHONPATH: /app

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis-data:/data]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on: [redis]
    environment: *backend-env
    ports: ["8000:8000"]

  worker:                       # rq worker: 真正跑流水线的进程
    build: ./backend
    restart: unless-stopped
    depends_on: [redis]
    environment: *backend-env
    command: ["rq", "worker", "-u", "redis://redis:6379/0", "dejaview"]

  frontend:
    build:
      context: ./frontend
      args:
        # 留空 = 浏览器走同源相对 /api，由 next.config 反代到 backend 服务。
        # 单端口即可对外，无需知道/配置公网地址，后端端口也不必暴露。
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-}
    restart: unless-stopped
    depends_on: [backend]
    environment:
      DEJAVIEW_BACKEND: http://backend:8000   # next.config 把 /api/* 反代到后端
    ports: ["3000:3000"]

  postgres:                     # 可选: docker compose --profile pg up
    image: postgres:16-alpine
    profiles: [pg]
    restart: unless-stopped
    environment:
      POSTGRES_USER: dejaview
      POSTGRES_PASSWORD: dejaview
      POSTGRES_DB: dejaview
    volumes: [pg-data:/var/lib/postgresql/data]

volumes:
  redis-data:
  pg-data:
