# Render Blueprint for separate API and frontend services.
# Add secret values in the Render dashboard; never commit real credentials.
services:
  - type: web
    name: dejaview-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DEJAVIEW_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEJAVIEW_ACCESS_CODE
        sync: false
      - key: DEJAVIEW_CORS_ORIGINS
        value: https://dejaview-frontend.onrender.com
      - key: DEJAVIEW_MODEL_CHEAP
        value: deepseek-v4-flash
      - key: DEJAVIEW_MODEL_STANDARD
        value: deepseek-v4-flash
      - key: DEJAVIEW_MODEL_STRONG
        value: deepseek-v4-flash
      - key: DEJAVIEW_CRAWLER
        value: builtin
      - key: DEJAVIEW_REPOMAP
        value: builtin
      - key: DEJAVIEW_SEARCH_PROVIDER
        value: composite
      - key: DEJAVIEW_SEARCH_SOURCES
        value: github,v2ex
      - key: DEJAVIEW_JOBSTORE
        value: memory
      - key: DEJAVIEW_QUEUE
        value: thread
      - key: DEJAVIEW_RATE_LIMIT_ENABLED
        value: "true"
      - key: DEJAVIEW_RATE_LIMIT_PER_IP_HOURLY
        value: "0"
      - key: DEJAVIEW_RATE_LIMIT_PER_IP_DAILY
        value: "5"
      - key: DEJAVIEW_RATE_LIMIT_DAILY_TOTAL
        value: "200"

  - type: web
    name: dejaview-frontend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: DEJAVIEW_BACKEND
        value: https://dejaview-backend.onrender.com
